name: Android CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release with the Release APK"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Lint & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Prepare Release Signing Keystore
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using repository secrets for release signing."
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, or KEY_PASSWORD secrets for production release tag build."
            exit 1
          else
            echo "RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, or KEY_PASSWORD secrets are not set. Generating an ephemeral CI signing keystore for non-tag verification only."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "ci-release-store" \
              -keypass "ci-release-store" \
              -dname "CN=Cascade CI, OU=Mobile, O=Cascade, L=Unknown, S=Unknown, C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=ci-release-store" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=ci-release-store" >> "$GITHUB_ENV"
          fi

      - name: Run Lint and Build Release APK
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_GAMEPLAY_UNIT_ID: ${{ secrets.ADMOB_BANNER_GAMEPLAY_UNIT_ID }}
          ADMOB_REWARDED_GOLD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_GOLD_UNIT_ID }}
          ADMOB_REWARDED_CONTINUE_UNIT_ID: ${{ secrets.ADMOB_REWARDED_CONTINUE_UNIT_ID }}
          ADMOB_REWARDED_DIAMOND_UNIT_ID: ${{ secrets.ADMOB_REWARDED_DIAMOND_UNIT_ID }}
          ADMOB_REWARDED_WHEEL_UNIT_ID: ${{ secrets.ADMOB_REWARDED_WHEEL_UNIT_ID }}
        run: |
          rm -f .env
          if [ -n "$ADMOB_APP_ID" ]; then echo "ADMOB_APP_ID=$ADMOB_APP_ID" >> .env; fi
          if [ -n "$ADMOB_BANNER_GAMEPLAY_UNIT_ID" ]; then echo "ADMOB_BANNER_GAMEPLAY_UNIT_ID=$ADMOB_BANNER_GAMEPLAY_UNIT_ID" >> .env; fi
          if [ -n "$ADMOB_REWARDED_GOLD_UNIT_ID" ]; then echo "ADMOB_REWARDED_GOLD_UNIT_ID=$ADMOB_REWARDED_GOLD_UNIT_ID" >> .env; fi
          if [ -n "$ADMOB_REWARDED_CONTINUE_UNIT_ID" ]; then echo "ADMOB_REWARDED_CONTINUE_UNIT_ID=$ADMOB_REWARDED_CONTINUE_UNIT_ID" >> .env; fi
          if [ -n "$ADMOB_REWARDED_DIAMOND_UNIT_ID" ]; then echo "ADMOB_REWARDED_DIAMOND_UNIT_ID=$ADMOB_REWARDED_DIAMOND_UNIT_ID" >> .env; fi
          if [ -n "$ADMOB_REWARDED_WHEEL_UNIT_ID" ]; then echo "ADMOB_REWARDED_WHEEL_UNIT_ID=$ADMOB_REWARDED_WHEEL_UNIT_ID" >> .env; fi
          EXTRA=""
          if [[ "${{ github.ref }}" != refs/tags/v* ]]; then EXTRA="-PallowTestAds=true"; fi
          if [ -x ./gradlew ]; then
            ./gradlew lint assembleRelease --no-daemon $EXTRA
          else
            gradle lint assembleRelease --no-daemon $EXTRA
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: block-falls-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}"
          name: "Block Falls ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
